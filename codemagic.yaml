# Codemagic CI/CD for the Tantu phone app (apps/mobile, Expo / React Native).
# ---------------------------------------------------------------------------
# Same shape as slk-mobile's file, which already builds and ships on this
# account: Android (APK + AAB) and iOS (IPA → TestFlight), both on mac_mini_m2,
# started by a push to main. The native projects are generated on the build
# machine with `expo prebuild`, so no android/ or ios/ folder is committed.
#
# The app talks to the live server by default (apps/mobile/app.json →
# extra.apiBase). Set EXPO_PUBLIC_API_BASE in a variable group to override.
#
# ONE-TIME SETUP in the Codemagic UI (nothing here needs a password in the repo):
#   • Add this GitHub repo (VVISTECH-git/tantu-tryon) as a Codemagic app; it
#     reads this file.
#   • Android signing: the existing keystore reference `slk` (Teams → Code
#     signing identities → Android keystores) signs this app too. To keep the
#     apps apart later, upload a second keystore and change the name below.
#   • iOS signing: the existing App Store Connect integration "VVIS Codemagic"
#     and a `signing` variable group holding the secure var
#     CERTIFICATE_PRIVATE_KEY, exactly as slk-mobile/docs/ios-signing.md
#     describes (one persistent distribution certificate, reused).
#   • App Store Connect: create the app record "Tantu" with bundle id
#     com.vvistech.tantu before the first iOS build, so TestFlight has
#     somewhere to put the IPA. The workflow registers the bundle id itself.
# ---------------------------------------------------------------------------

definitions:
  install: &install
    name: Install pnpm and dependencies
    script: |
      corepack enable
      corepack prepare pnpm@11.24.0 --activate
      pnpm install --frozen-lockfile
  typecheck: &typecheck
    name: Typecheck the app and its shared package
    script: |
      pnpm --filter @tantu/shared typecheck
      pnpm --filter @tantu/mobile typecheck

workflows:
  # =========================================================================
  # ANDROID — signed APK + AAB
  # =========================================================================
  android-workflow:
    name: Android (APK + AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Started by hand for now: a push starts only the iPhone build, so the two
    # never queue behind each other on the one free machine.
    environment:
      node: 22.14.0
      java: 17
      android_signing:
        - slk
      vars:
        PACKAGE_NAME: "com.vvistech.tantu"
    scripts:
      - *install
      - *typecheck
      - name: Generate the native Android project
        script: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install --clean
      - name: Point the release build at the Codemagic keystore
        script: |
          cd apps/mobile/android
          cat >> gradle.properties <<EOF
          TANTU_STORE_FILE=$CM_KEYSTORE_PATH
          TANTU_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          TANTU_KEY_ALIAS=$CM_KEY_ALIAS
          TANTU_KEY_PASSWORD=$CM_KEY_PASSWORD
          EOF
          # Expo's template signs release with the debug key; swap in ours.
          sed -i '' 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' app/build.gradle
          sed -i '' '/signingConfigs {/a\
                  release {\
                      storeFile file(TANTU_STORE_FILE)\
                      storePassword TANTU_STORE_PASSWORD\
                      keyAlias TANTU_KEY_ALIAS\
                      keyPassword TANTU_KEY_PASSWORD\
                  }' app/build.gradle
      - name: Build APK + AAB
        script: |
          cd apps/mobile/android
          ./gradlew assembleRelease bundleRelease --no-daemon -PversionCode=$BUILD_NUMBER
    artifacts:
      - apps/mobile/android/app/build/outputs/**/*.apk
      - apps/mobile/android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - bhanuboddu09@gmail.com
        notify:
          success: true
          failure: true

  # =========================================================================
  # iOS — signed IPA → TestFlight (internal testers install from the
  # TestFlight app on the iPhone). Named "iOS (Ad Hoc)" to read the same as
  # slk-mobile's workflow in the Codemagic build list.
  # =========================================================================
  ios-workflow:
    name: iOS (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: "VVIS Codemagic"
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      groups:
        - signing # holds the secure var CERTIFICATE_PRIVATE_KEY (see slk-mobile/docs/ios-signing.md)
      vars:
        BUNDLE_ID: "com.vvistech.tantu"
        XCODE_WORKSPACE: "apps/mobile/ios/Tantu.xcworkspace"
        XCODE_SCHEME: "Tantu"
    scripts:
      - *install
      - *typecheck
      - name: Generate the native iOS project and install pods
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --clean
      - name: Set up code signing
        # One persistent distribution certificate, reused every build; the
        # bundle id and provisioning profile are created on the first run.
        script: |
          set -ex
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # Codemagic's ever-rising build counter keeps every TestFlight upload higher than the last.
          agvtool new-version -all $BUILD_NUMBER || true
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - bhanuboddu09@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
