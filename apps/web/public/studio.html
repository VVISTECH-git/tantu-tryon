<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tantu Studio</title>
<style>
  /*
    One file, no build. Open it, change it, refresh.

    The point of this page is that a change costs seconds rather than a commit
    and a deploy. Everything it needs is here: no framework, no bundler, no
    node_modules. The only thing it talks to is Tantu's product lookup, which
    is read-only and needs no credential from the browser.
  */
  :root {
    --paper: #faf7f0;
    --surface: #ffffff;
    --ink: #1c1917;
    --ink-soft: #57534e;
    --ink-faint: #857c72;
    --line: #e7ded0;
    --accent: #24405c;
    --accent-wash: #eef2f7;
    --madder: #9c3327;
    --font: "Onest", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    background: #9c3327;
    color: #fff;
    padding: 14px 22px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header.top b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  header.top span { font-size: 13px; opacity: 0.85; }

  .wrap {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    gap: 30px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 26px 22px 70px;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  aside { position: sticky; top: 22px; align-self: start; }
  h2.sec {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 9px;
    padding: 9px 12px;
    font: inherit;
    font-variant-numeric: tabular-nums;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    padding: 7px 14px;
    font-size: 13px;
    transition: border-color .15s, color .15s;
  }
  button:hover { border-color: var(--ink-faint); color: var(--ink); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    border-radius: 9px; padding: 9px 16px; font-size: 14px; font-weight: 500;
  }
  button.primary:hover { background: #1b3149; color: #fff; }
  button.wide { width: 100%; margin-top: 12px; }
  button.copied { background: var(--accent); border-color: var(--accent); color: #fff; }

  .card { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 18px; }
  .muted { color: var(--ink-faint); font-size: 13px; }
  .soft { color: var(--ink-soft); }
  .divider { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; }

  .part { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .part img {
    width: 40px; height: 40px; object-fit: cover;
    border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
  }
  .part .name { flex: 1; min-width: 0; text-transform: capitalize; font-size: 13px; color: var(--ink-soft); }
  .part a {
    text-decoration: none; font-size: 12px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
  }
  .part a:hover { border-color: var(--ink-faint); color: var(--ink); }

  main h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .prompt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 20px; margin-top: 16px; }
  .prompt .head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .pill {
    background: var(--accent-wash); color: var(--accent);
    border-radius: 999px; padding: 2px 9px;
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .prompt h3 { font-size: 15px; font-weight: 600; margin: 0; }
  .prompt .body {
    margin: 13px 0 0;
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }
  .note {
    border: 1px solid rgba(156,51,39,.35); background: rgba(156,51,39,.05);
    color: var(--madder); border-radius: 12px; padding: 12px 15px;
    font-size: 13.5px; margin-top: 18px;
  }
  .err {
    border: 1px solid rgba(180,40,40,.4); background: rgba(180,40,40,.05);
    color: #a12; border-radius: 9px; padding: 9px 12px; font-size: 13px; margin-top: 11px;
  }
  .spacer { flex: 1; }
</style>
</head>
<body>

<header class="top"><b>Tantu</b><span>Studio — prompts, not renders</span></header>

<div class="wrap">
  <aside>
    <h2 class="sec">Saree</h2>
    <div class="row">
      <input type="text" id="code" inputmode="numeric" placeholder="300021" aria-label="Product code">
      <button class="primary" id="find">Find</button>
    </div>
    <p class="muted" style="margin:9px 0 0">The code on the label. Photographs come from SLK.</p>
    <div id="err"></div>
    <div id="product"></div>
  </aside>

  <main>
    <h1>Prompts</h1>
    <p class="soft" style="margin:6px 0 0;font-size:14px">
      Copy the prompt, attach the saree photographs, and generate wherever you
      like. Nothing is generated or charged here.
    </p>
    <div id="prompts"></div>
  </main>
</div>

<script>
/*
  Change the API here if you point this at a local server.
  Everything else on this page is presentation.
*/
const API = "https://tantu-tryon.vercel.app";

/*
  The prompts, verbatim.

  Kept exactly as written — these are proven wordings, and tidying one is how
  a proven thing stops being proven. To add the next pose, append an object.
  Nothing else needs to change.
*/
const PROMPTS = [
  {
    id: "P1",
    title: "Front, symmetrical",
    summary: "Hands clasped at the waist, pallu peaked over the left shoulder and away behind.",
    text: "A professional fashion catalog photo of a woman in her mid-20s wearing a cotton saree as per the reference image. She stands facing the camera directly in a symmetrical, centered pose, with both hands clasped together at her waist. The saree pallu is pleated neatly and thrown up and over the left shoulder from front to back, forming a distinct peaked, pointed shape of fabric rising at the shoulder edge before going over and down her back. Only the front portion of the pallu near the collarbone and shoulder point is visible; the majority of the pallu length falls behind her shoulder and down her back, out of view from the front. The pleats must be clean, straight, and evenly spaced — like neatly pressed fabric folds, not bunched or crumpled. She has a direct, confident gaze and a neutral-to-soft expression. Full-length portrait, tightly framed so her figure fills most of the vertical frame from head to feet, shot straight-on at eye level with minimal headroom and minimal space around her. She is positioned in a sunlit traditional Indian courtyard, framed symmetrically by a single stone arch directly behind her head, with pillars on either side, background softly blurred. Styled with gold jhumka earrings, a gold choker-style necklace, and bangles. Warm, golden directional lighting."
  }
];

const EXPECTED = 4;
const SLOTS = ["body", "pallu", "border", "blouse"];

const $ = (id) => document.getElementById(id);

function copyButton(text, label = "Copy") {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      b.textContent = "Copied";
      b.classList.add("copied");
      setTimeout(() => { b.textContent = label; b.classList.remove("copied"); }, 1600);
    } catch { /* clipboard blocked; the text is on screen and selectable */ }
  };
  return b;
}

function renderPrompts() {
  const host = $("prompts");
  host.innerHTML = "";

  const bar = document.createElement("div");
  bar.style.cssText = "display:flex;align-items:center;gap:12px;margin-top:16px";
  const count = document.createElement("span");
  count.className = "muted";
  count.textContent = `Testing ${PROMPTS.length} of ${EXPECTED}`;
  bar.append(count, Object.assign(document.createElement("div"), { className: "spacer" }));
  if (PROMPTS.length > 1) {
    bar.append(copyButton(PROMPTS.map((p) => `${p.id} — ${p.title}\n\n${p.text}`).join("\n\n———\n\n"), "Copy all"));
  }
  host.append(bar);

  for (const p of PROMPTS) {
    const card = document.createElement("article");
    card.className = "prompt";

    const head = document.createElement("div");
    head.className = "head";
    const pill = document.createElement("span");
    pill.className = "pill";
    pill.textContent = p.id;
    const h3 = document.createElement("h3");
    h3.textContent = p.title;
    head.append(pill, h3, Object.assign(document.createElement("div"), { className: "spacer" }), copyButton(p.text));

    const sum = document.createElement("p");
    sum.className = "muted";
    sum.style.margin = "7px 0 0";
    sum.textContent = p.summary;

    const body = document.createElement("p");
    body.className = "body";
    body.textContent = p.text;

    card.append(head, sum, body);
    host.append(card);
  }

  if (PROMPTS.length < EXPECTED) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = `One pose at a time, on purpose — this one gets proven before the next is offered. ${EXPECTED - PROMPTS.length} still to come.`;
    host.append(note);
  }
}

function renderProduct(p) {
  const host = $("product");
  host.innerHTML = "";
  if (!p) return;

  const info = document.createElement("div");
  info.className = "divider";
  const title = document.createElement("p");
  title.style.cssText = "margin:0;font-weight:500;font-size:15px";
  title.textContent = p.title;
  const code = document.createElement("p");
  code.className = "muted";
  code.style.cssText = "margin:2px 0 0;font-variant-numeric:tabular-nums";
  code.textContent = p.code;
  info.append(title, code);

  if (p.design) {
    const tax = document.createElement("p");
    tax.className = "soft";
    tax.style.cssText = "margin:8px 0 0;font-size:13px";
    tax.textContent = [p.design.colour, p.design.motif, p.design.productType].filter(Boolean).join(" · ");
    info.append(tax);
  }

  const desc = document.createElement("p");
  desc.style.cssText = "margin:8px 0 0;font-size:13px;line-height:1.6";
  if (p.description) { desc.className = "soft"; desc.textContent = p.description; }
  else { desc.className = "muted"; desc.textContent = "No description written in SLK."; }
  info.append(desc);
  host.append(info);

  const photos = document.createElement("div");
  photos.className = "divider";
  const h = document.createElement("h2");
  h.className = "sec";
  h.textContent = "Photographs";
  photos.append(h);

  const missing = SLOTS.filter((s) => !p.parts.some((x) => x.slot === s));
  if (missing.length) {
    const warn = document.createElement("p");
    warn.className = "note";
    warn.style.marginTop = "0";
    warn.textContent = `Missing ${missing.join(", ")}.`;
    photos.append(warn);
  }

  for (const slot of SLOTS) {
    const part = p.parts.find((x) => x.slot === slot);
    if (!part) continue;
    const row = document.createElement("div");
    row.className = "part";

    const img = document.createElement("img");
    /*
      Straight from R2, unprocessed.

      An earlier version routed these through an image optimiser to save
      bandwidth, and that was the wrong trade twice over: it was slow on the
      multi-megabyte originals, and it invited the question of whether anything
      here is being recompressed. Nothing is. The thumbnail is the same file
      the Save link hands over, drawn small by the browser.
    */
    img.src = part.url;
    img.alt = part.alt || slot;
    img.loading = "lazy";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = slot;

    /*
      A plain link, not a scripted download. The API answers with
      Content-Disposition: attachment, so the browser saves it and names it
      300021-body.png — which is what matters when four files are about to be
      attached somewhere and "cced55d9-…png" tells you nothing.
    */
    const save = document.createElement("a");
    save.href = `${API}/api/products/${p.code}/image/${slot}`;
    save.textContent = "Save";
    save.setAttribute("download", `${p.code}-${slot}.png`);

    row.append(img, name, save);
    photos.append(row);
  }

  const all = document.createElement("button");
  all.className = "primary wide";
  all.textContent = `Download all ${p.parts.length}`;
  all.onclick = async () => {
    all.disabled = true;
    all.textContent = "Saving…";
    for (const part of p.parts) {
      const a = document.createElement("a");
      a.href = `${API}/api/products/${p.code}/image/${part.slot}`;
      a.download = `${p.code}-${part.slot}.png`;
      document.body.append(a);
      a.click();
      a.remove();
      // One at a time: a burst of saves from one gesture gets blocked.
      await new Promise((r) => setTimeout(r, 700));
    }
    all.disabled = false;
    all.textContent = `Download all ${p.parts.length}`;
  };
  photos.append(all);

  const hint = document.createElement("p");
  hint.className = "muted";
  hint.style.cssText = "margin:9px 0 0;line-height:1.55";
  hint.textContent = "Gemini cannot open a link — save the files and attach them. They are the originals, unresized.";
  photos.append(hint);

  host.append(photos);
}

async function find() {
  const code = $("code").value.trim();
  if (!code) return;
  $("err").innerHTML = "";
  renderProduct(null);
  const btn = $("find");
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const res = await fetch(`${API}/api/products/${encodeURIComponent(code)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Lookup failed (${res.status}).`);
    renderProduct(data);
  } catch (e) {
    $("err").innerHTML = `<p class="err">${e.message}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Find";
  }
}

$("find").onclick = find;
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });
renderPrompts();
</script>
</body>
</html>
